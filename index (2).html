<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <h1> Cadastrar usuário </h1>
    <div>
        
            <div>
                    <fieldset>
                        
                        <legend>1 Dados pessoais</legend>

                            <form action="index.html" method="post">

                                <label for="nome">Nome:</label>
                                <input type="text" name="nome_pessoa" id="nome">

                                <label for="email">Email:</label>
                                <input type="email" name="Pessoaemail" id="email">

                                <label for="senha">Senha:</label>
                                <input type="password" name="pass" id="senha">

                                <label for="senhaconf">Confirmar senha:</label>
                                <input type="password" name="confirm_pass" id="senhaconf">

                                <label for="idade">Idade:</label>

                                <input type="radio" name="idadeP" id="Idadeacima">
                                <label for="idadeacima">Acima de 17</label>

                                <input type="radio" name="idadeP" id="Idadeabaixo">
                                <label for="idadeabaixo">Abaixo ou igual17</label>

                                <br>
                
                            </form> 
                            
                    </fieldset>
            </div>
                <fieldset>
                    <legend>2 perfil</legend>

                    <label for="descricao">Descrição:</label>
                    <textarea name="txtdesc" id="descricao"></textarea>

                    <label for="perf_trabalho">Perfil Trabalho:</label>
                    <select name="trabalho" id="perf_trabalho">
                        <optgroup label="web">
                            <option value="front">Front-End_Developer</option>
                            <option value="back">Back-End_Developer</option>
                            <option value="front">Full-Stack_Developer</option>
                        </optgroup>
                    </select>
                        <optgroup label="Mobile">
                            <option value="front">Android_Developer</option>
                            <option value="back">IOS_Developer</option>
                        </optgroup>
                         <optgroup label="Rede">
                            <option value="front">Segurança</option>
                            <option value="back">Infra</option>
                        </optgroup>
               

                    <label>Interesses:</label>

                    <input type="checkbox" name="check_pro" id="programador">
                    <label for="programador">Programador</label>

                    <input type="checkbox" name="check_des" id="desing">
                    <label for="desing">Desing</label>

                    <input type="checkbox" name="check_ana" id="analista">
                    <label for="analista">Analista</label>

                </fieldset>
            </div>
        <button type="submit">Enviar dados</button>
    </div>
     
</body>
</html>
